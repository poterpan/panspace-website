name: { zh: Poter Pan, en: Poter Pan }
tagline:
  zh: 從 iOS App、網站到背後的 AI 與雲端服務，把想法做成上線的產品。
  en: I turn ideas into shipped products, from the iOS app to the AI and cloud services behind it.
bio:
  zh: 我是潘柏嘉（Poter），在台北念研究所，大學讀逢甲大學通訊工程學系。我做 iOS、全端與電腦視覺：北科盒子是我一個人開發、上架並持續維運的校園 App；另外也和醫學中心合作，開發脊椎 X 光的 AI 分析系統。大學時在 iOS Club 從教學、社長做到網管，教學和帶團隊也是我很重視的經驗。
  en: I'm Poter Pan, a graduate student in Taipei with a bachelor's in communications engineering from Feng Chia University. I work across iOS, full-stack and computer vision. NTUTBox is a campus app I built, shipped and still run on my own, and I also work with a medical center on an AI system for spine X-ray analysis. At university I went from instructor to president to webmaster of the iOS Club, and teaching and leading teams still matter a lot to me.
location: { zh: 台北, en: "Taipei, Taiwan" }
